# NOTE: Remix 3 (beta) does not yet ship an official Netlify adapter. This app
# now boots a standard Node server (`npm start`, see server.ts) built on
# `remix/node-fetch-server`. Production hosting needs to run that Node server
# (e.g. a Node host, container, or a future Remix 3 Netlify adapter) rather than
# the old bundled-function approach. The build below only produces the GraphQL
# types and the compiled CSS in `public/`.
[build]
command = "npm run build"
publish = "public"
environment = { NODE_VERSION = "24" }

[dev]
command = "npm run dev"
targetPort = 3000

# Set immutable caching for fingerprinted asset files.
[[headers]]
for = "/assets/*"

[headers.values]
"Cache-Control" = "public, max-age=60, immutable"

[[redirects]]
from = "/business-card"
to = "/"
status = 302
